<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>암호를 함수로 읽다 · 공통수학2 함수와 그래프</title>
<meta name="description" content="카이사르부터 해시까지, 암호를 함수·합성함수·역함수로 다루는 수업용 도구">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --paper:#E9EBE4; --paper2:#F5F6F1; --card:#FCFCFA;
  --ink:#16232B; --ink2:#54626A; --ink3:#8A959B;
  --rule:#C7CCC1; --rule2:#DDE0D8;
  --blue:#2F5D8C; --blue-l:#E2EAF3;
  --green:#2C7A57; --green-l:#DFEDE6;
  --brick:#A43A22; --brick-l:#F5E3DE;
  --amber:#D3A029; --amber-l:#FAF0D6;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --r:3px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.65;
  background-image:linear-gradient(var(--rule2) 1px,transparent 1px),linear-gradient(90deg,var(--rule2) 1px,transparent 1px);
  background-size:28px 28px; background-position:-1px -1px;
}
h1,h2,h3,h4{line-height:1.3; margin:0; font-weight:600; letter-spacing:-.01em}
p{margin:0 0 .8em}
button{font-family:inherit; font-size:inherit; cursor:pointer}
input,select,textarea{font-family:inherit; font-size:inherit; color:var(--ink)}
a{color:var(--blue)}

/* ---------- shell ---------- */
.shell{max-width:1240px; margin:0 auto; padding:0 20px 90px}
header.top{
  border-bottom:2px solid var(--ink); margin-bottom:26px; padding:22px 0 16px;
  display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap;
}
.brand h1{font-size:26px; letter-spacing:-.02em}
.brand .sub{color:var(--ink2); font-size:13.5px; margin-top:3px}
#heroCipher{font-family:var(--mono); font-size:26px; letter-spacing:.16em; color:var(--blue); font-weight:500}
.layout{display:grid; grid-template-columns:222px 1fr; gap:30px; align-items:start}

/* ---------- nav ---------- */
nav.steps{position:sticky; top:16px}
nav.steps ol{list-style:none; margin:0; padding:0; border-top:1px solid var(--rule)}
nav.steps li{border-bottom:1px solid var(--rule)}
nav.steps button{
  width:100%; text-align:left; background:none; border:0; padding:10px 8px 10px 34px;
  position:relative; color:var(--ink2); font-size:14.5px; line-height:1.35;
}
nav.steps button .n{
  position:absolute; left:6px; top:11px; font-family:var(--mono); font-size:11px; color:var(--ink3);
}
nav.steps button:hover{color:var(--ink); background:var(--paper2)}
nav.steps button[aria-current="true"]{color:var(--ink); font-weight:600; background:var(--card); box-shadow:inset 3px 0 0 var(--blue)}
nav.steps button[aria-current="true"] .n{color:var(--blue)}
nav.steps .grp{font-size:11.5px; color:var(--ink3); padding:14px 8px 5px; letter-spacing:.02em}

/* ---------- panels ---------- */
section.panel{display:none; animation:fade .18s ease-out}
section.panel.on{display:block}
@keyframes fade{from{opacity:0}to{opacity:1}}
.phead{margin-bottom:20px}
.phead h2{font-size:23px}
.phead .lead{color:var(--ink2); font-size:15px; margin-top:6px; max-width:70ch}
.card{background:var(--card); border:1px solid var(--rule); border-radius:var(--r); padding:18px 20px; margin-bottom:16px}
.card > h3{font-size:16px; margin-bottom:4px}
.card > h3 + .hint{margin-top:0}
.hint{color:var(--ink2); font-size:13.5px; margin:6px 0 12px; max-width:74ch}
.two{display:grid; grid-template-columns:1fr 1fr; gap:16px}
.two > *{margin-bottom:0}

/* ---------- form bits ---------- */
label.f{display:block; font-size:13px; color:var(--ink2); margin-bottom:5px}
.in{
  width:100%; padding:9px 11px; border:1px solid var(--rule); border-radius:var(--r);
  background:#fff; outline-offset:2px;
}
.in:focus-visible{outline:2px solid var(--blue)}
.in.mono{font-family:var(--mono); letter-spacing:.06em}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-bottom:12px}
.row > .fl{flex:1 1 180px; min-width:0}
.row > .fs{flex:0 0 110px}
.btn{
  padding:9px 15px; border:1px solid var(--ink); border-radius:var(--r);
  background:var(--ink); color:var(--paper2); font-weight:500;
}
.btn:hover{background:#000}
.btn.g{background:none; color:var(--ink); border-color:var(--rule)}
.btn.g:hover{background:var(--paper2); border-color:var(--ink3)}
.btn.b{background:var(--blue); border-color:var(--blue)}
.btn.b:hover{background:#24486d}
.btn:focus-visible{outline:2px solid var(--amber); outline-offset:2px}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.chk{display:inline-flex; align-items:center; gap:6px; font-size:13.5px; color:var(--ink2); cursor:pointer}

/* ---------- output ---------- */
.out{
  font-family:var(--mono); background:var(--paper2); border:1px solid var(--rule);
  border-radius:var(--r); padding:12px 14px; word-break:break-all; white-space:pre-wrap;
  font-size:15px; line-height:1.8;
}
.out.big{font-size:clamp(20px,3.4vw,34px); letter-spacing:.14em; text-align:center; padding:22px 14px; color:var(--blue); font-weight:500}
.out.empty{color:var(--ink3); letter-spacing:0; font-weight:400}
.tag{display:inline-block; font-size:11.5px; padding:2px 7px; border-radius:99px; vertical-align:middle}
.tag.t{background:var(--amber-l); color:#7a5b06; border:1px solid #E7D398}
.tag.s{background:var(--blue-l); color:var(--blue); border:1px solid #C3D5E8}

/* teacher zone */
.teacher{border-left:3px solid var(--amber); background:var(--amber-l)}
.teacher summary{cursor:pointer; font-weight:600; font-size:15px; padding:2px 0; list-style:none}
.teacher summary::-webkit-details-marker{display:none}
.teacher summary::before{content:"▸ "; color:var(--amber)}
.teacher[open] summary::before{content:"▾ "}

/* ---------- tables ---------- */
table.t{border-collapse:collapse; width:100%; font-size:14px}
table.t th,table.t td{border:1px solid var(--rule); padding:6px 9px; text-align:left}
table.t th{background:var(--paper2); font-weight:600; font-size:13px}
table.t td.m,table.t th.m{font-family:var(--mono); text-align:center}
.scroll{overflow-x:auto; -webkit-overflow-scrolling:touch}

/* step trace */
.trace{display:flex; flex-wrap:wrap; gap:7px}
.tr{
  display:grid; grid-template-columns:auto; gap:0; border:1px solid var(--rule);
  border-radius:var(--r); overflow:hidden; font-family:var(--mono); font-size:13px; text-align:center; min-width:64px;
}
.tr div{padding:3px 7px; border-bottom:1px solid var(--rule2)}
.tr div:last-child{border-bottom:0}
.tr .a{background:var(--paper2); font-weight:600}
.tr .b{color:var(--ink2); font-size:11.5px}
.tr .c{background:var(--amber-l); color:#7a5b06}
.tr .d{background:var(--blue-l); color:var(--blue); font-weight:600}

/* scytale wrap animation */
.stage{position:relative; margin:8px 0 4px; transition:height .55s cubic-bezier(.4,0,.2,1)}
.scell{
  position:absolute; left:0; top:0; width:30px; height:30px; line-height:28px;
  text-align:center; font-family:var(--mono); font-size:15px; font-weight:600;
  border:1px solid var(--rule); border-radius:2px; background:#fff; color:var(--ink);
  transition:transform .55s cubic-bezier(.4,0,.2,1), background-color .4s ease, border-color .4s ease;
}
.rod{
  height:8px; border-radius:4px; background:linear-gradient(#C9A227,#8A6D14);
  margin:0 0 6px; transition:opacity .4s ease, width .55s cubic-bezier(.4,0,.2,1);
}
textarea.in{resize:vertical; line-height:1.55}

/* frequency bars */
.freq{display:flex; align-items:flex-end; gap:2px; height:110px; border-bottom:1px solid var(--ink); padding-top:6px}
.freq .bar{flex:1; background:var(--blue); min-height:1px; position:relative; border-radius:1px 1px 0 0}
.freq.alt .bar{background:var(--brick)}
.freqx{display:flex; gap:2px; font-family:var(--mono); font-size:9.5px; color:var(--ink3); margin-top:3px}
.freqx span{flex:1; text-align:center}

/* result banner */
.res{margin-top:12px; padding:12px 14px; border-radius:var(--r); font-weight:600; display:none}
.res.ok{display:block; background:var(--green-l); border:1px solid var(--green); color:var(--green)}
.res.no{display:block; background:var(--brick-l); border:1px solid var(--brick); color:var(--brick)}
.res .sm{font-weight:400; font-size:13.5px; color:var(--ink2); margin-top:5px; display:block}
@keyframes shake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(4px)}50%{transform:translateX(-5px)}}
.shake{animation:shake .4s}
#confetti{position:fixed; inset:0; pointer-events:none; z-index:99; display:none}

/* misc */
.eq{font-family:var(--mono); background:var(--blue-l); color:var(--blue); padding:1px 6px; border-radius:2px; font-size:.94em}
ul.tight{margin:.2em 0 .8em; padding-left:1.15em} ul.tight li{margin-bottom:.25em}
.note{border-left:3px solid var(--blue); background:var(--blue-l); padding:11px 14px; border-radius:0 var(--r) var(--r) 0; font-size:14px; margin:12px 0}
.note.warn{border-color:var(--brick); background:var(--brick-l)}
.kpi{font-family:var(--mono); font-size:30px; font-weight:600}
svg.map{width:100%; height:auto; display:block}
footer{margin-top:40px; padding-top:16px; border-top:1px solid var(--rule); color:var(--ink3); font-size:13px}

@media (max-width:980px){
  .layout{grid-template-columns:1fr; gap:16px}
  nav.steps{position:static}
  nav.steps ol{display:flex; overflow-x:auto; border-top:0; border-bottom:1px solid var(--rule); gap:2px}
  nav.steps li{border-bottom:0; flex:0 0 auto}
  nav.steps button{white-space:nowrap; padding:9px 13px}
  nav.steps button .n{position:static; display:block; margin-bottom:-2px}
  nav.steps button[aria-current="true"]{box-shadow:inset 0 -3px 0 var(--blue)}
  nav.steps .grp{display:none}
  .two{grid-template-columns:1fr}
  #heroCipher{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important}}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div class="shell">
<header class="top">
  <div class="brand">
    <h1>암호를 함수로 읽다</h1>
    <div class="sub">공통수학2 · 함수와 그래프 · 2차시 수업 도구</div>
  </div>
  <div id="heroCipher" aria-hidden="true">PDWKHPDWLFV</div>
</header>
<div class="layout">
<nav class="steps" aria-label="수업 단계">
  <div class="grp">1차시 · 암호를 함수로 번역하기</div>
  <ol id="navList"></ol>
</nav>
<main id="main"></main>
</div>
<footer>
  알파벳은 A=0, B=1, …, Z=25로 대응시킵니다. 나머지 함수 <span class="eq">r(x)</span>는 x를 26으로 나눈 나머지입니다.
</footer>
</div>
<script>
const PANELS = [
/* 0 */ {id:"scytale", nav:"기둥에 감는 암호", grp:1, title:"기둥에 감는 암호 (스키테일)",
lead:"글자는 하나도 바뀌지 않았는데 왜 읽을 수 없을까요? 이 암호에서 변하는 것은 글자가 아니라 자리입니다.", html:`
<div class="card">
  <h3>띠를 감았다 풀기</h3>
  <p class="hint">막대에 띠를 감고 가로로 글을 쓴 뒤 띠를 풀면, 글자가 한 줄로 흩어져 읽을 수 없게 됩니다. 같은 굵기의 막대에 다시 감아야만 읽힙니다.</p>
  <div class="row">
    <div class="fl"><label class="f" for="sc-text">원문</label><input class="in mono" id="sc-text" value="MATH IS A SECRET KEY"></div>
    <div class="fs"><label class="f" for="sc-n">한 바퀴 글자 수</label><input class="in mono" id="sc-n" type="number" min="2" max="12" value="4"></div>
  </div>
  <div class="row">
    <button class="btn b" id="sc-wrap">막대에 감기</button>
    <span class="hint" id="sc-state" style="margin:0"></span>
  </div>
  <div class="scroll">
    <div id="sc-rod" class="rod"></div>
    <div id="sc-stage" class="stage"></div>
  </div>
  <label class="f" style="margin-top:14px">풀린 띠를 그대로 읽은 것 (= 암호문)</label>
  <div class="out big" id="sc-out"></div>
  <div class="note">글자의 <b>종류</b>는 하나도 바뀌지 않았습니다. 바뀐 것은 <b>자리</b>뿐입니다. 그렇다면 이 암호를 함수로 쓸 때 정의역에 들어가야 하는 것은 글자가 아니라 <span class="eq">자리 번호</span>입니다.</div>
  <label class="f" style="margin-top:6px">자리 번호를 옮기는 함수</label>
  <div class="scroll" id="sc-trace"></div>
</div>`},

/* 1 */ {id:"caesar", nav:"카이사르 암호", grp:1, title:"카이사르 암호",
lead:"규칙을 찾아 원문을 복원하고, 그 규칙을 식으로 써 봅시다.", html:`
<details class="card teacher" id="cz-teacher">
  <summary>교사용 · 문제 만들기 <span class="tag t">학생에게 보이지 않음</span></summary>
  <div style="margin-top:12px">
    <div class="row">
      <div class="fl"><label class="f" for="cz-plain">원문 (가려짐)</label><input class="in mono" id="cz-plain" type="password" value="hello world" autocomplete="off"></div>
      <div class="fs"><label class="f" for="cz-shift">시프트</label><input class="in mono" id="cz-shift" type="password" value="3" autocomplete="off"></div>
    </div>
    <div class="row">
      <button class="btn b" id="cz-make">암호문 내보내기</button>
      <button class="btn g" id="cz-peek" type="button">입력 확인</button>
      <button class="btn g" id="cz-answer" type="button">정답 공개</button>
    </div>
    <p class="hint" style="margin:0">입력하는 동안 원문과 시프트는 ●로 가려집니다. 학생이 맞히면 자동으로 공개됩니다.</p>
  </div>
</details>
<div class="card">
  <h3>학생 도전 · 이 암호문을 해독하세요</h3>
  <div class="out big empty" id="cz-cipher">교사가 암호문을 내보내면 여기에 나타납니다</div>
  <div class="row" style="margin-top:14px">
    <div class="fl"><label class="f" for="cz-guess">원문을 입력하세요</label><input class="in mono" id="cz-guess" placeholder="예: hello world" autocomplete="off"></div>
    <button class="btn" id="cz-check">확인</button>
    <button class="btn g" id="cz-hint" type="button">힌트</button>
    <button class="btn g" id="cz-brute" type="button">25가지 다 해보기</button>
  </div>
  <div class="res" id="cz-res"></div>
  <div id="cz-bruteBox" hidden style="margin-top:12px"></div>
</div>
<div class="card" id="cz-revealBox" hidden>
  <h3>규칙을 함수로 쓰면</h3>
  <div id="cz-formula"></div>
</div>
<div class="card">
  <h3>직접 해 보기 · 두 함수의 합성</h3>
  <p class="hint">더하는 단계와 나머지를 구하는 단계를 나누어 보여 줍니다. 중간값이 26을 넘어가는 글자를 눈여겨보세요.</p>
  <div class="row">
    <div class="fs"><label class="f" for="cs-shift">시프트 k</label><input class="in mono" id="cs-shift" type="number" value="3"></div>
  </div>
  <div id="cs-eq" class="note" style="margin-top:0"></div>

  <label class="f">암호화 <span class="tag s" id="cs-elab">E</span></label>
  <div class="row" style="margin-bottom:8px">
    <div class="fl"><input class="in mono" id="cs-text" value="mathematics" placeholder="원문을 입력하세요"></div>
  </div>
  <div class="out big" id="cs-out"></div>
  <div class="row" style="margin:10px 0 0">
    <button class="btn g" id="cs-down" type="button">⟳ 이 결과를 아래 복호화 칸으로</button>
  </div>

  <label class="f" style="margin-top:16px">복호화 <span class="tag s" id="cs-dlab">D</span></label>
  <div class="row" style="margin-bottom:8px">
    <div class="fl"><input class="in mono" id="cs-text2" placeholder="암호문을 입력하세요"></div>
  </div>
  <div class="out big empty" id="cs-out2">—</div>
  <div class="res" id="cs-idres"></div>

  <label class="f" style="margin-top:16px">암호화의 단계별 계산</label>
  <div class="trace" id="cs-trace"></div>
</div>`},

/* 2 */ {id:"affine", nav:"아핀 암호와 일대일대응", grp:1, title:"아핀 암호 · 왜 하필 일대일대응인가",
lead:"a 값을 바꾸면서 26개의 화살표가 어디로 가는지 보세요.", html:`
<div class="card">
  <h3>f(x) = r(ax + b) 는 무엇인가</h3>
  <p class="hint">카이사르 암호는 <span class="eq">b</span> 만큼 <b>밀기만</b> 했습니다. <span class="eq">E(x) = r(x + 3)</span> 에서 3이 바로 그 b 입니다. 아핀 암호는 밀기 전에 <span class="eq">a</span> 배 <b>늘리기</b>를 한 번 더 합니다.</p>
  <div class="out" style="font-size:14.5px; text-align:center">x  ──(× a)──▶  ax  ──(+ b)──▶  ax + b  ──( r )──▶  r(ax + b)</div>
  <ul class="tight" style="margin-top:12px">
    <li><span class="eq">a</span> · 늘리는 배율 (곱하는 수)</li>
    <li><span class="eq">b</span> · 미는 칸 수 (더하는 수)</li>
    <li><span class="eq">r</span> · 26으로 나눈 나머지. 26을 넘어간 값을 알파벳 안으로 되접는 역할</li>
  </ul>
  <div class="note">즉 <span class="eq">g(x) = ax + b</span> 라 두면 <span class="eq">f = r ∘ g</span> 입니다. 여기서 <b>a = 1 이면 그대로 카이사르 암호</b>가 됩니다. 카이사르는 아핀의 특수한 경우입니다.</div>
  <p class="hint" style="margin-bottom:0">아래에서 a 값을 바꿔 가며 대응 그림을 관찰하세요. 어떤 a 에서는 26개의 화살표가 26곳으로 흩어지고, 어떤 a 에서는 몇 곳으로 몰립니다. <b>왜 그럴까요?</b></p>
</div>
<div class="card">
  <div class="row">
    <div class="fs"><label class="f" for="af-a">a</label><input class="in mono" id="af-a" type="number" value="5"></div>
    <div class="fs"><label class="f" for="af-b">b</label><input class="in mono" id="af-b" type="number" value="3"></div>
    <div class="row" style="margin:0; gap:6px">
      <button class="btn g" data-af="5,3">a=5</button>
      <button class="btn g" data-af="13,5">a=13</button>
      <button class="btn g" data-af="2,7">a=2</button>
    </div>
  </div>
  <div id="af-verdict"></div>
  <div class="two" style="margin-top:14px">
    <div>
      <label class="f">대응 그림 (왼쪽 정의역 → 오른쪽 공역)</label>
      <div id="af-map"></div>
    </div>
    <div>
      <label class="f">문자열에 적용</label>

<script>

/* ===== 기본 도구 ===== */

/* 파이썬과 달리 자바스크립트의 %는 음수를 그대로 돌려주므로 나머지 함수를 따로 정의한다.
   이것이 수업에서 약속한 r(x) 이다. */
const r = (x, m = 26) => ((x % m) + m) % m;
const isAl = c => /[a-z]/i.test(c);
const num = c => AL.indexOf(c.toLowerCase());
const chr = (n, upper) => upper ? AL[r(n)].toUpperCase() : AL[r(n)];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const onlyAl = s => s.toLowerCase().replace(/[^a-z]/g, "");
const gcd = (a, b) => b ? gcd(b, a % b) : Math.abs(a);
const calmMotion = () => { try { return matchMedia("(prefers-reduced-motion:reduce)").matches; } catch (_) { return false; } };

function caesar(text, k) {
  let out = "";
  for (const c of text) out += isAl(c) ? chr(num(c) + k, c === c.toUpperCase()) : c;
  return out;
}
function affine(text, a, b) {
  let out = "";
  for (const c of text) out += isAl(c) ? chr(a * num(c) + b, c === c.toUpperCase()) : c;
  return out;
}
function monoalpha(text, key, decrypt) {
  const inv = {};
  for (let i = 0; i < 26; i++) inv[key[i]] = AL[i];
  let out = "";
  for (const c of text) {
    if (!isAl(c)) { out += c; continue; }
    const low = c.toLowerCase();
    const m = decrypt ? (inv[low] ?? low) : key[num(low)];
    out += c === c.toUpperCase() ? m.toUpperCase() : m;
  }
  return out;
}
/* 원본 코드는 공백·문장부호에서도 키가 진행되었다.
   수업에서 정의역을 (글자, 몇 번째 글자)로 잡았으므로 알파벳일 때만 진행시킨다. */
function vigenere(text, keyword, decrypt) {
  const key = onlyAl(keyword);
  if (!key) return text;
  let out = "", i = 0;
  for (const c of text) {
    if (!isAl(c)) { out += c; continue; }
    const s = num(key[i % key.length]) * (decrypt ? -1 : 1);
    out += chr(num(c) + s, c === c.toUpperCase());
    i++;
  }
  return out;
}
function freq(text) {
  const f = new Array(26).fill(0);
  for (const c of text) if (isAl(c)) f[num(c)]++;
  return f;
}
function drawFreq(barEl, xEl, counts) {
  const max = Math.max(1, ...counts);
  barEl.innerHTML = counts.map((v, i) =>
    `<div class="bar" style="height:${(v / max * 100).toFixed(1)}%" title="${AL[i].toUpperCase()}: ${v}"></div>`).join("");
  if (xEl) xEl.innerHTML = AL.split("").map(c => `<span>${c}</span>`).join("");
}

/* ===== 축하 효과 ===== */
const cv = $("#confetti"), cx = cv.getContext("2d");
let parts = [], raf = 0;
function celebrate() {
  if (calmMotion()) return;
  cv.width = innerWidth; cv.height = innerHeight; cv.style.display = "block";
  const cols = ["#2C7A57", "#2F5D8C", "#D3A029", "#A43A22", "#16232B"];
  parts = Array.from({ length: 120 }, () => ({
    x: innerWidth / 2 + (Math.random() - .5) * 240, y: innerHeight * .34,
    vx: (Math.random() - .5) * 11, vy: Math.random() * -13 - 3,
    s: 5 + Math.random() * 6, a: Math.random() * 6.3, va: (Math.random() - .5) * .3,
    c: cols[(Math.random() * cols.length) | 0], life: 110
  }));
  cancelAnimationFrame(raf); tick();
}
function tick() {
  cx.clearRect(0, 0, cv.width, cv.height);
  let alive = 0;
  for (const p of parts) {
    if (p.life-- <= 0) continue;
    alive++; p.vy += .32; p.x += p.vx; p.y += p.vy; p.a += p.va;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.a);
    cx.globalAlpha = Math.min(1, p.life / 40); cx.fillStyle = p.c;
    cx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .55); cx.restore();
  }
  if (alive) raf = requestAnimationFrame(tick); else cv.style.display = "none";
}

/* ===== 00 스키테일 =====
   띠를 푼 상태에서는 글자가 암호문 순서(세로로 읽어 내려간 순서)로 한 줄에 늘어서고,
   막대에 감으면 각 글자가 제자리(행, 열)를 찾아가 가로로 원문이 읽힌다.
   실물 스키테일과 같은 방향이며, 자리 번호가 옮겨 가는 모습이 그대로 함수가 된다. */
(() => {
  const t = $("#sc-text"), n = $("#sc-n"), stage = $("#sc-stage"), out = $("#sc-out"),
    btn = $("#sc-wrap"), state = $("#sc-state"), rod = $("#sc-rod"), trace = $("#sc-trace");
  const CW = 30, CH = 30, G = 3, TINT = ["var(--blue-l)", "var(--green-l)", "var(--amber-l)", "var(--brick-l)"];
  let wrapped = false, items = [], nodes = [];

  function model() {
    const s = t.value.replace(/[^A-Za-z0-9가-힣]/g, "").toUpperCase();
    const cols = Math.max(2, Math.min(12, +n.value || 4));
    const rows = Math.ceil(s.length / cols) || 1;
    /* 띠 순서 = 열을 따라 아래로 훑은 순서 */
    const list = [];
    for (let c = 0; c < cols; c++) for (let rI = 0; rI < rows; rI++) {
      const idx = rI * cols + c;
      if (s[idx] !== undefined) list.push({ ch: s[idx], row: rI, col: c, plain: idx });
    }
    return { s, cols, rows, list };
  }
  function build() {
    const m = model();
    items = m.list;
    stage.innerHTML = "";
    nodes = items.map(it => {
      const d = document.createElement("div");
      d.className = "scell"; d.textContent = it.ch;
      d.style.transition = "none";
      stage.appendChild(d);
      return d;
    });
    place(m);
    requestAnimationFrame(() => nodes.forEach(d => { d.style.transition = ""; }));
  }
  function place(m) {
    m = m || model();
    nodes.forEach((d, j) => {
      const it = items[j];
      const x = wrapped ? it.col * (CW + G) : j * (CW + G);
      const y = wrapped ? it.row * (CH + G) : 0;
      d.style.transform = `translate(${x}px,${y}px)`;
      d.style.background = wrapped ? TINT[it.col % TINT.length] : "#fff";
      d.style.borderColor = wrapped ? "var(--ink3)" : "var(--rule)";
    });
    stage.style.width = ((wrapped ? m.cols : Math.max(1, items.length)) * (CW + G)) + "px";
    stage.style.height = ((wrapped ? m.rows : 1) * (CH + G)) + "px";
    rod.style.width = (m.cols * (CW + G)) + "px";
    rod.style.opacity = wrapped ? "1" : "0.18";
    out.textContent = items.map(i => i.ch).join("") || "—";
    btn.textContent = wrapped ? "띠 풀기" : "막대에 감기";
    state.textContent = wrapped
      ? `한 바퀴에 ${m.cols}글자로 감았습니다. 가로로 읽으면 원문이 나타납니다.`
      : `풀린 띠입니다. 글자는 그대로인데 한 줄로 흩어져 읽을 수 없습니다.`;
    drawTrace(m);
  }
  function drawTrace(m) {
    const show = items.slice(0, 14);
    if (!show.length) { trace.innerHTML = ""; return; }
    const head = show.map((_, j) => `<td class="m">${j + 1}</td>`).join("");
    const body = show.map(it => `<td class="m" style="color:#2F5D8C">${it.plain + 1}</td>`).join("");
    const chs = show.map(it => `<td class="m">${esc(it.ch)}</td>`).join("");
    trace.innerHTML = `<table class="t">
      <tr><th class="m">띠에서의 자리</th>${head}</tr>
      <tr><th class="m">감았을 때의 자리</th>${body}</tr>
      <tr><th class="m">글자</th>${chs}</tr></table>
      <p class="hint" style="margin:8px 0 0">정의역도 공역도 <b>자리 번호의 집합</b>입니다. 글자는 어디에도 등장하지 않습니다${items.length > 14 ? " (앞 14자리만 표시)" : ""}.</p>`;
  }
  btn.onclick = () => { wrapped = !wrapped; place(); };
  t.oninput = n.oninput = build;
  build();
})();

/* ===== 01 카이사르 ===== */
(() => {
  let answer = "", shiftUsed = 0, tries = 0;
  const plain = $("#cz-plain"), shift = $("#cz-shift"), disp = $("#cz-cipher"),
    guess = $("#cz-guess"), res = $("#cz-res"), revealBox = $("#cz-revealBox");

  function say(kind, msg, sub) {
    res.className = "res " + kind;
    res.innerHTML = esc(msg) + (sub ? `<span class="sm">${sub}</span>` : "");
  }
  function reveal() {
    const k = r(shiftUsed), back = r(26 - k);
    $("#cz-formula").innerHTML = `
      <div class="out" style="font-size:15px">g(x) = x + ${k}          E = r ∘ g,  즉 E(x) = r(x + ${k})
h(x) = x + ${back}          D = r ∘ h,  즉 D(x) = r(x + ${back})</div>
      <div class="note" style="margin-bottom:0">−${k} 과 +${back} 은 다른 수인데 왜 같은 일을 할까요? 26으로 나눈 나머지가 같기 때문입니다.
      그리고 <span class="eq">D ∘ E = I</span> 이므로 D는 E의 역함수입니다.</div>
      <p class="hint" style="margin-bottom:0">원문: <b>${esc(answer)}</b> · 시프트: <b>${k}</b></p>`;
    revealBox.hidden = false;
  }
  $("#cz-make").onclick = () => {
    const p = plain.value.trim();
    if (!onlyAl(p)) { say("no", "원문에 알파벳을 넣어 주세요."); return; }
    shiftUsed = r(parseInt(shift.value, 10) || 0);
    answer = p; tries = 0;
    disp.textContent = caesar(p, shiftUsed).toUpperCase();
    disp.classList.remove("empty");
    guess.value = ""; res.className = "res"; revealBox.hidden = true;
    $("#cz-bruteBox").hidden = true;
    $("#cz-teacher").open = false;
    guess.focus();
  };
  $("#cz-peek").onclick = () => {
    const to = plain.type === "password" ? "text" : "password";
    plain.type = shift.type = to;
  };
  $("#cz-answer").onclick = () => { if (answer) { say("ok", "정답을 공개했습니다."); reveal(); } };
  $("#cz-check").onclick = () => {
    if (!answer) { say("no", "먼저 교사가 암호문을 내보내야 합니다."); return; }
    tries++;
    if (onlyAl(guess.value) === onlyAl(answer)) {
      say("ok", "정답입니다!", `${tries}번 만에 맞혔습니다. 이제 이 규칙을 식으로 써 봅시다.`);
      reveal(); celebrate();
    } else {
      say("no", "아직 아닙니다.", `${tries}번째 시도입니다. 가장 많이 나온 글자가 무엇인지 살펴보세요.`);
      guess.classList.remove("shake"); void guess.offsetWidth; guess.classList.add("shake");
    }
  };
  guess.addEventListener("keydown", e => { if (e.key === "Enter") $("#cz-check").click(); });
  $("#cz-hint").onclick = () => {
    if (!answer) return;
    say("no", "힌트", `원문은 <b>${esc(answer.slice(0, 3))}</b> 로 시작합니다.`);
  };
  $("#cz-brute").onclick = () => {
    const box = $("#cz-bruteBox");
    if (!answer) return;
    if (!box.hidden) { box.hidden = true; return; }
    const ct = disp.textContent;
    let rows = "";
    for (let k = 1; k <= 25; k++) rows += `<tr><td class="m">${k}</td><td class="m" style="text-align:left">${esc(caesar(ct, -k).toLowerCase())}</td></tr>`;
    box.innerHTML = `<p class="hint">시프트는 25가지뿐이므로 전부 시도해 볼 수 있습니다. 이것이 카이사르 암호의 결정적 약점입니다.</p>
      <div class="scroll" style="max-height:280px"><table class="t"><tr><th class="m">되돌린 칸 수</th><th>결과</th></tr>${rows}</table></div>`;
    box.hidden = false;
  };

  /* 자유 실험 · 암호화 줄과 복호화 줄을 따로 두어 두 결과를 동시에 본다 */
  const ct = $("#cs-text"), ct2 = $("#cs-text2"), ck = $("#cs-shift"),
    o1 = $("#cs-out"), o2 = $("#cs-out2"), idres = $("#cs-idres");
  function run() {
    const k = r(parseInt(ck.value, 10) || 0), back = r(-k);
    $("#cs-elab").textContent = `E(x) = r(x + ${k})`;
    $("#cs-dlab").textContent = `D(x) = r(x + ${back})`;
    $("#cs-eq").innerHTML = `<span class="eq">g(x) = x + ${k}</span> 와 나머지 함수 <span class="eq">r</span> 의 합성이 <span class="eq">E = r ∘ g</span> 입니다.
      되돌릴 때는 빼지 않고 <span class="eq">${back}</span> 을 더합니다. 한 바퀴가 26칸이기 때문입니다.`;

    const enc = caesar(ct.value, k);
    o1.textContent = enc.toUpperCase() || "—";
    o1.classList.toggle("empty", !onlyAl(ct.value));

    const dec = caesar(ct2.value, back);
    o2.textContent = ct2.value ? (dec.toUpperCase() || "—") : "—";
    o2.classList.toggle("empty", !onlyAl(ct2.value));

    const a = onlyAl(ct.value), b = onlyAl(dec);
    if (a && b && a === b) {
      idres.className = "res ok";
      idres.innerHTML = `원문으로 정확히 돌아왔습니다.<span class="sm">D(E(x)) = x 이므로 <b>D ∘ E = I</b> 입니다. D 는 E 의 역함수입니다.</span>`;
    } else if (onlyAl(ct2.value)) {
      idres.className = "res"; idres.innerHTML = "";
    } else {
      idres.className = "res"; idres.innerHTML = "";
    }

    const cells = [...ct.value].filter(isAl).slice(0, 40).map(c => {
      const x = num(c), y = x + k;
      return `<div class="tr"><div class="a">${esc(c.toUpperCase())}</div><div class="b">${x}</div>
        <div class="c">${y}</div><div class="b">↓ r</div><div class="b">${r(y)}</div>
        <div class="d">${chr(y, true)}</div></div>`;
    }).join("");
    $("#cs-trace").innerHTML = cells || `<span class="hint">알파벳을 입력해 주세요.</span>`;
  }
  $("#cs-down").onclick = () => { ct2.value = $("#cs-out").textContent.replace("—", ""); run(); ct2.focus(); };
  ct.oninput = ct2.oninput = ck.oninput = run; run();
})();

/* ===== 02 아핀 ===== */
(() => {
  const ia = $("#af-a"), ib = $("#af-b"), it = $("#af-text");
  function run() {
    const a = r(parseInt(ia.value, 10) || 0), b = r(parseInt(ib.value, 10) || 0);
    const g = gcd(a, 26), size = 26 / g, ok = g === 1;
    $("#af-verdict").innerHTML = ok
      ? `<div class="note"><b>일대일대응입니다.</b> 치역의 원소가 ${size}개로 공역과 같습니다. 서로 다른 글자는 반드시 서로 다른 글자로 가므로 되돌릴 수 있습니다. 역함수가 존재합니다.</div>`
      : `<div class="note warn"><b>일대일이 아닙니다.</b> 치역의 원소가 ${size}개뿐입니다. ${g}개의 글자가 한 곳으로 몰리므로 어느 글자였는지 알 수 없습니다. <b>역함수가 존재하지 않아 복호화할 수 없습니다.</b></div>`;
    const H = 13, top = 14, W = 300;
    let svg = `<svg class="map" viewBox="0 0 ${W} ${26 * H + 24}" role="img" aria-label="아핀 암호의 대응 그림">`;
    for (let i = 0; i < 26; i++) {
      const y1 = top + i * H, y2 = top + r(a * i + b) * H;
      svg += `<line x1="56" y1="${y1}" x2="244" y2="${y2}" stroke="${ok ? "#2F5D8C" : "#A43A22"}" stroke-width="1" opacity="${ok ? .5 : .75}"/>`;
    }
    for (let i = 0; i < 26; i++) {
      const y = top + i * H;
      svg += `<text x="44" y="${y + 4}" font-size="10.5" font-family="monospace" fill="#54626A" text-anchor="end">${AL[i].toUpperCase()}</text>`;
      svg += `<text x="256" y="${y + 4}" font-size="10.5" font-family="monospace" fill="#54626A">${AL[i].toUpperCase()}</text>`;
      svg += `<circle cx="56" cy="${y}" r="2" fill="#16232B"/><circle cx="244" cy="${y}" r="2" fill="#16232B"/>`;
    }
    $("#af-map").innerHTML = svg + "</svg>";
    $("#af-out").textContent = affine(it.value, a, b).toUpperCase() || "—";
    const set = [...new Set(Array.from({ length: 26 }, (_, i) => AL[r(a * i + b)].toUpperCase()))].sort();
    $("#af-range").textContent = `${set.join(" ")}   (${set.length}개)`;
  }
  ia.oninput = ib.oninput = it.oninput = run;
  document.querySelectorAll("[data-af]").forEach(btn => btn.onclick = () => {
    const [a, b] = btn.dataset.af.split(","); ia.value = a; ib.value = b; run();
  });
  run();
})();

/* ===== 03 단일치환 ===== */
(() => {
  const key = $("#mo-key"), txt = $("#mo-text"), txt2 = $("#mo-text2"), idres = $("#mo-idres");
  function valid(k) { return k.length === 26 && new Set(k).size === 26 && [...k].every(c => AL.includes(c)); }
  function run() {
    const k = key.value.toLowerCase().trim();
    if (!valid(k)) {
      $("#mo-table").innerHTML = `<tr><td style="color:#A43A22">치환 키는 26개의 알파벳이 한 번씩 모두 들어가야 합니다. 현재 ${k.length}글자.</td></tr>`;
      $("#mo-out").textContent = "—"; return;
    }
    $("#mo-table").innerHTML =
      `<tr><th class="m">원문</th>${[...AL].map(c => `<td class="m">${c.toUpperCase()}</td>`).join("")}</tr>` +
      `<tr><th class="m">암호</th>${[...k].map(c => `<td class="m" style="color:#2F5D8C">${c.toUpperCase()}</td>`).join("")}</tr>`;

    const src = txt.value, out = monoalpha(src, k, false);
    $("#mo-out").textContent = out || "—";
    $("#mo-out").classList.toggle("empty", !onlyAl(src));

    const back = monoalpha(txt2.value, k, true);
    $("#mo-out2").textContent = txt2.value ? (back || "—") : "—";
    $("#mo-out2").classList.toggle("empty", !onlyAl(txt2.value));

    const a = onlyAl(src), b = onlyAl(back);
    if (a && b && a === b) {
      idres.className = "res ok";
      idres.innerHTML = `원문으로 정확히 돌아왔습니다.<span class="sm">대응표를 거꾸로 읽은 것이 역함수입니다. 식이 없어도 역함수는 존재합니다.</span>`;
    } else { idres.className = "res"; idres.innerHTML = ""; }

    drawFreq($("#mo-f1"), $("#mo-fx1"), freq(src));
    drawFreq($("#mo-f2"), $("#mo-fx2"), freq(out));
  }
  $("#mo-down").onclick = () => { txt2.value = $("#mo-out").textContent.replace("—", ""); run(); txt2.focus(); };
  $("#mo-shuffle").onclick = () => {
    const a = [...AL];
    for (let i = 25; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0;[a[i], a[j]] = [a[j], a[i]]; }
    key.value = a.join(""); run();
  };
  key.oninput = txt.oninput = txt2.oninput = run; run();
})();

/* ===== 04 비즈네르 ===== */
(() => {
  const t = $("#vi-text"), t2 = $("#vi-text2"), k = $("#vi-key"), idres = $("#vi-idres");
  /* 순서쌍 기호 대신, 키워드 길이만큼의 카이사르 함수를 f, g, h … 로 이름 붙여 보여 준다.
     학생이 1차시에서 이미 쓴 이름이라 낯설지 않다. */
  const NM = ["f", "g", "h", "p", "q", "t"];
  function drawFuncs(kw) {
    const L = kw.length;
    if (L > NM.length) {
      $("#vi-funcs").innerHTML = `<p class="hint" style="margin:0">키워드가 ${L}글자이므로 카이사르 암호 ${L}개를 자리에 따라 번갈아 적용합니다. 함수 이름을 붙여 보려면 키워드를 ${NM.length}글자 이하로 줄여 보세요.</p>`;
    } else {
      const lines = [...kw].map((c, i) => {
        const s = num(c), ord = [i + 1, i + 1 + L, i + 1 + 2 * L].join(", ");
        return `${NM[i]}(x) = r(x + ${String(s).padStart(2, " ")})   ← ${c.toUpperCase()} 자리 · ${ord}, … 번째 글자`;
      }).join("\n");
      $("#vi-funcs").innerHTML = `<div class="out" style="font-size:14px">${esc(lines)}</div>`;
    }
    const heads = [...kw].slice(0, NM.length).map((c, i) => `${NM[i]}(A) = ${chr(num(c), true)}`).join(", ");
    $("#vi-notfn").innerHTML = L > 1
      ? `<b>그런데 E(A) 는 얼마일까요?</b> ${esc(heads)} … 답이 하나로 정해지지 않습니다.
         함수는 각 원소에 <b>오직 하나</b>를 대응시켜야 하므로, 글자만 정의역으로 삼으면 이것은 <b>함수가 아닙니다.</b>`
      : `키워드가 한 글자이면 자리와 무관하게 같은 함수를 쓰므로, 이것은 그냥 카이사르 암호입니다.`;
  }
  function run() {
    const src = t.value, kw = onlyAl(k.value) || "a";
    const out = vigenere(src, kw, false);
    $("#vi-out").textContent = out.toUpperCase() || "—";
    $("#vi-out").classList.toggle("empty", !onlyAl(src));

    const back = vigenere(t2.value, kw, true);
    $("#vi-out2").textContent = t2.value ? (back.toUpperCase() || "—") : "—";
    $("#vi-out2").classList.toggle("empty", !onlyAl(t2.value));
    const a = onlyAl(src), b = onlyAl(back);
    if (a && b && a === b) {
      idres.className = "res ok";
      idres.innerHTML = `원문으로 정확히 돌아왔습니다.<span class="sm">자리마다 쓴 함수의 역함수를 같은 자리에 그대로 적용하면 됩니다.</span>`;
    } else { idres.className = "res"; idres.innerHTML = ""; }

    drawFuncs(kw);
    const chars = [...src].slice(0, 30);
    let i = 0, rowA = "", rowK = "", rowC = "";
    chars.forEach((c, n) => {
      const isL = isAl(c);
      const kc = isL ? kw[i % kw.length].toUpperCase() : "";
      if (isL) i++;
      rowA += `<td class="m">${esc(c === " " ? "␣" : c.toUpperCase())}</td>`;
      rowK += `<td class="m" style="color:#D3A029">${kc || "·"}</td>`;
      rowC += `<td class="m" style="color:#2F5D8C">${esc((out[n] || "").toUpperCase())}</td>`;
    });
    $("#vi-align").innerHTML = `<table class="t"><tr><th class="m">원문</th>${rowA}</tr><tr><th class="m">키</th>${rowK}</tr><tr><th class="m">암호</th>${rowC}</tr></table>`;
    drawFreq($("#vi-f1"), $("#vi-fx1"), freq(src));
    drawFreq($("#vi-f2"), $("#vi-fx2"), freq(out));
  }
  $("#vi-down").onclick = () => { t2.value = $("#vi-out").textContent.replace("—", ""); run(); t2.focus(); };
  t.oninput = t2.oninput = k.oninput = run; run();
})();

/* ===== 05 RSA ===== */
(() => {
  const els = ["rs-p", "rs-q", "rs-e", "rs-m"].map(i => $("#" + i));
  const isPrime = n => { if (n < 2) return false; for (let i = 2; i * i <= n; i++) if (n % i === 0) return false; return true; };
  function powSteps(base, exp, n) {
    const rows = []; let acc = 1;
    for (let i = 1; i <= exp; i++) {
      const before = acc * base, after = r(before, n);
      rows.push([i, `${acc} × ${base} = ${before}`, `${before} ÷ ${n} 의 나머지`, after]);
      acc = after;
    }
    return { rows, value: acc };
  }
  function table(head, rows) {
    return `<table class="t"><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr>` +
      rows.map(x => `<tr>${x.map((c, i) => `<td class="${i ? "" : "m"}">${esc(c)}</td>`).join("")}</tr>`).join("") + `</table>`;
  }
  function run() {
    const [p, q, e, m] = els.map(x => parseInt(x.value, 10) || 0);
    const n = p * q, phi = (p - 1) * (q - 1);
    let msg = "";
    if (!isPrime(p) || !isPrime(q)) msg = "p 와 q 는 소수여야 합니다.";
    else if (p === q) msg = "p 와 q 는 서로 다른 소수여야 합니다.";
    else if (gcd(e, phi) !== 1) msg = `e = ${e} 는 φ = ${phi} 와 서로소가 아닙니다. 다른 e 를 골라 주세요.`;
    else if (m < 0 || m >= n) msg = `원문은 0 이상 ${n} 미만의 수여야 합니다.`;
    if (msg) {
      $("#rs-keys").innerHTML = `<div class="note warn">${esc(msg)}</div>`;
      $("#rs-enc").innerHTML = $("#rs-dec").innerHTML = ""; $("#rs-verdict").innerHTML = ""; return;
    }
    let d = 1; while (r(d * e, phi) !== 1) d++;
    $("#rs-keys").innerHTML = `<div class="out" style="font-size:15px">n = p × q = ${p} × ${q} = ${n}
φ = (p−1)(q−1) = ${p - 1} × ${q - 1} = ${phi}
공개키 (n, e) = (${n}, ${e})        ← 누구나 알아도 됨
비밀키 d = ${d}                      ← e × d 를 ${phi} 로 나눈 나머지가 1</div>`;
    const enc = powSteps(m, e, n), dec = powSteps(enc.value, d, n);
    $("#rs-enc").innerHTML = table(["회", "계산", "나머지 구하기", "결과"], enc.rows) +
      `<div class="note" style="margin-bottom:0">E(${m}) = <b>${enc.value}</b></div>`;
    $("#rs-dec").innerHTML = table(["회", "계산", "나머지 구하기", "결과"], dec.rows);
    $("#rs-verdict").innerHTML = dec.value === m
      ? `<div class="note"><b>D(E(${m})) = ${dec.value} = ${m}</b> · 원문으로 정확히 돌아왔습니다. <span class="eq">D ∘ E = I</span> 이므로 D 는 E 의 역함수입니다.</div>`
      : `<div class="note warn">돌아오지 않았습니다. 입력을 확인해 주세요.</div>`;
  }
  els.forEach(x => x.oninput = run);
  const bits = $("#rs-bits");
  function est() {
    const dgt = Math.max(2, Math.min(1000, +bits.value || 617));
    const logTrials = dgt / 2;                    // 대략 √n 번 나눠 보기
    const logYears = logTrials - 12 - 7.5;        // 1초에 10^12번, 1년 ≈ 10^7.5초
    const ratio = logYears - 10.14;               // 우주의 나이 138억 년
    $("#rs-time").innerHTML = logYears < 0
      ? `<div class="note">1초도 걸리지 않습니다. 이 정도 크기는 안전하지 않습니다.</div>`
      : `<div class="note">1초에 1조 번씩 나눠 봐도 약 <b>10<sup>${logYears.toFixed(0)}</sup>년</b>이 걸립니다.
         우주의 나이의 약 <b>10<sup>${ratio.toFixed(0)}</sup>배</b>입니다.</div>`;
  }
  bits.oninput = est; run(); est();
})();

/* ===== 06 해시 ===== */
(() => {
  const t = $("#ha-text"), md = $("#ha-mod"), w = $("#ha-w");
  const H = (s, m, weighted) => {
    const L = onlyAl(s); let sum = 0;
    for (let i = 0; i < L.length; i++) sum += (weighted ? (i + 1) : 1) * num(L[i]);
    return { sum, val: r(sum, m) };
  };
  function run() {
    const m = Math.max(2, +md.value || 26), L = onlyAl(t.value);
    const { sum, val } = H(t.value, m, w.checked);
    $("#ha-cod").textContent = m.toLocaleString();
    $("#ha-calc").innerHTML = L
      ? `<div class="out" style="font-size:14px">${[...L].map((c, i) => `${w.checked ? (i + 1) + "×" : ""}${c.toUpperCase()}(${num(c)})`).join(" + ")} = ${sum}
${sum} 을 ${m} 으로 나눈 나머지 = ${val}</div>`
      : `<p class="hint">알파벳을 입력해 주세요.</p>`;
    $("#ha-out").textContent = L ? val : "—";
    $("#ha-coll").innerHTML = "";
  }
  $("#ha-find").onclick = () => {
    const m = Math.max(2, +md.value || 26), src = onlyAl(t.value);
    if (!src) return;
    const target = H(src, m, w.checked).val;
    const found = [];
    const three = src.length >= 3;
    outer:
    for (let a = 0; a < 26; a++) for (let b = 0; b < 26; b++) {
      for (let c = 0; c < (three ? 26 : 1); c++) {
        const cand = three ? AL[a] + AL[b] + AL[c] : AL[a] + AL[b];
        if (cand === src) continue;
        if (H(cand, m, w.checked).val === target) { found.push(cand.toUpperCase()); if (found.length >= 6) break outer; }
      }
    }
    $("#ha-coll").innerHTML = found.length
      ? `<div class="res ok" style="display:block">해시값이 같은 다른 단어를 찾았습니다.
          <span class="sm">${esc(src.toUpperCase())} 와 ${found.map(esc).join(", ")} 은 모두 해시값이 ${target} 입니다.
          두 단어가 같은 곳으로 갔으므로 이 함수는 일대일이 아닙니다. 해시값만 보고는 어느 단어였는지 알 수 없습니다.</span></div>`
      : `<div class="res no" style="display:block">이 조건에서는 찾지 못했습니다. <span class="sm">나눌 수를 줄이거나 단어를 짧게 해 보세요.</span></div>`;
  };
  t.oninput = md.oninput = run; w.onchange = run; run();

  /* SHA-256 */
  const sh = $("#sh-text");
  async function sha256(s) {
    if (!(crypto && crypto.subtle)) return null;
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
  }
  async function runSha() {
    const h = await sha256(sh.value);
    $("#sh-out").textContent = h ?? "이 기능은 https 주소에서만 동작합니다. 파일을 직접 열지 말고 GitHub Pages 주소로 접속해 주세요.";
  }
  sh.oninput = runSha; runSha();
  $("#sh-ava").onclick = async () => {
    const a = sh.value, b = a ? a.slice(0, -1) + String.fromCharCode(a.charCodeAt(a.length - 1) + 1) : "a";
    const [ha, hb] = await Promise.all([sha256(a), sha256(b)]);
    if (!ha) return;
    let diff = 0; for (let i = 0; i < 64; i++) if (ha[i] !== hb[i]) diff++;
    $("#sh-ava-out").innerHTML = `<div class="out" style="font-size:12.5px">${esc(a)}
${ha}

${esc(b)}
${hb}</div><div class="note">마지막 글자 하나만 바꿨는데 64자리 중 ${diff}자리가 달라졌습니다. 결과를 보고 입력을 짐작할 방법이 없습니다.</div>`;
  };
})();

/* ===== 07 AES ===== */
(() => {
  $("#ae-run").onclick = async () => {
    const pt = $("#ae-text").value;
    if (!(crypto && crypto.subtle)) {
      $("#ae-ct").textContent = "이 기능은 https 주소에서만 동작합니다."; return;
    }
    const key = await crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(pt));
    $("#ae-ct").textContent = [...new Uint8Array(ct)].map(b => b.toString(16).padStart(2, "0")).join("");
    const back = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ct);
    $("#ae-pt").textContent = new TextDecoder().decode(back);
  };
})();

/* ===== 08 심화 활동 · 나만의 암호 설계 =====
   맞고 틀림을 채점하지 않는다. 빠진 칸을 짚어 주고, 설계한 것을 함수의 말로
   다시 진술하게 하는 것이 목적이다. */
(() => {
  const F = id => $("#" + id), V = id => (F(id).value || "").trim();
  const box = $("#my-out");
  function report() {
    const name = V("my-name"), dom = V("my-dom"), cod = V("my-cod"),
      rule = V("my-rule"), inv = V("my-inv");
    const c1 = F("my-c1").checked, c2 = F("my-c2").checked, c3 = F("my-c3").checked;

    const todo = [];
    if (!rule) todo.push("규칙이 비어 있습니다. 식이 어렵다면 말로 써도 됩니다. 남이 읽고 <b>똑같이 따라 할 수 있을 만큼</b>만 구체적이면 충분합니다.");
    if (!dom) todo.push("정의역이 비어 있습니다. 무엇을 넣는 함수인가요? 글자인가요, 자리 번호인가요, 아니면 둘을 묶은 것인가요?");
    if (!cod) todo.push("공역이 비어 있습니다. 정의역보다 <b>작다면</b> 반드시 충돌이 생깁니다. 비둘기집 원리입니다.");
    if (!inv) todo.push("되돌리는 방법이 비어 있습니다. 되돌릴 수 없게 만든 것이라면 그렇게 적고, 어디에 쓸 암호인지 함께 써 보세요.");
    if (!c1) todo.push("서로 다른 두 입력이 같은 출력으로 가는지 아직 확인하지 않았습니다. 이것이 일대일 여부를 가릅니다.");
    if (!c2) todo.push("역함수가 있는지 아직 판단하지 않았습니다.");
    if (!c3) todo.push("규칙이 알려졌을 때 얼마나 버티는지 아직 생각해 보지 않았습니다. 카이사르는 25번만 해 보면 뚫렸습니다.");

    const ask = [];
    if (dom && cod) ask.push("정의역의 원소 개수와 공역의 원소 개수 중 어느 쪽이 큽니까? 정의역이 더 크다면 충돌은 피할 수 없습니다.");
    if (inv) ask.push("되돌리는 방법이 원래 규칙의 <b>역함수</b>가 맞는지, 실제로 한 글자를 넣어 왕복시켜 확인해 보세요.");
    if (rule && /\+|\-|×|\*|x/i.test(rule)) ask.push("규칙을 두 단계 이상으로 나눌 수 있다면 <b>합성함수</b>로 써 보세요. 카이사르를 r ∘ g 로 썼던 것처럼요.");
    ask.push("이 암호는 오늘 표의 어느 줄에 들어갑니까? 되돌릴 수 있는지, 되돌릴 수 있다면 쉽게 되는지로 판단하면 됩니다.");

    box.innerHTML = `
      <div class="${todo.length ? "res no" : "res ok"}" style="display:block; margin-top:14px">
        ${todo.length ? "조금 더 채우면 설계가 완성됩니다." : `설계가 갖추어졌습니다${name ? " · " + esc(name) : ""}.`}
        <span class="sm">${todo.length ? "아래 항목을 살펴보세요." : "이제 아래 질문에 답하면서 스스로 검토해 보세요."}</span>
      </div>
      ${todo.length ? `<ul class="tight" style="margin-top:12px">${todo.map(x => `<li>${x}</li>`).join("")}</ul>` : ""}
      <div class="note" style="margin-top:${todo.length ? "4" : "14"}px"><b>스스로에게 던질 질문</b>
        <ul class="tight" style="margin:8px 0 0">${ask.map(x => `<li>${x}</li>`).join("")}</ul>
      </div>`;
  }
  function plain() {
    return [
      `[나만의 암호 설계]`,
      `이름: ${V("my-name") || "(없음)"}`,
      `정의역: ${V("my-dom") || "(비어 있음)"}`,
      `공역: ${V("my-cod") || "(비어 있음)"}`,
      `규칙: ${V("my-rule") || "(비어 있음)"}`,
      `되돌리는 방법: ${V("my-inv") || "(비어 있음)"}`
    ].join("\n");
  }
  $("#my-check").onclick = report;
  $("#my-copy").onclick = async () => {
    const txt = plain();
    let ok = false;
    try { await navigator.clipboard.writeText(txt); ok = true; } catch (_) { ok = false; }
    box.innerHTML = ok
      ? `<div class="res ok" style="display:block; margin-top:14px">설계를 복사했습니다.<span class="sm">활동지나 메모장에 붙여 넣으세요.</span></div>`
      : `<div class="res no" style="display:block; margin-top:14px">복사가 막혀 있습니다.<span class="sm">아래 내용을 직접 선택해 복사하세요.</span></div>
         <div class="out" style="margin-top:10px; font-size:13.5px">${esc(txt)}</div>`;
  };
})();

/* ===== 첫 화면 한 번의 움직임 ===== */
(() => {
  const el = $("#heroCipher"); if (!el) return;
  if (calmMotion()) { el.textContent = "MATHEMATICS"; return; }
  const base = "MATHEMATICS"; let k = 3;
  const id = setInterval(() => {
    el.textContent = caesar(base, k).toUpperCase();
    if (k-- <= 0) clearInterval(id);
  }, 260);
})();
</script>
